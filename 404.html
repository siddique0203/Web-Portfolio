<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found | Md Abu Bakar Siddique</title>
    <script>
      (function () {
        try {
          var p = localStorage.getItem("theme") || "dark";
          var d = p === "dark" || (p === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", d ? "dark" : "light");
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .nf { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 2rem; }
      .nf h1 { font-size: clamp(4rem, 14vw, 8rem); line-height: 1; color: var(--accent); }
      .nf p { color: var(--text-dim); margin: 1rem 0 2rem; }
    </style>
  </head>
  <body>
    <main class="nf">
      <div>
        <h1>404</h1>
        <p>The page you are looking for does not exist.</p>
        <a class="btn btn-primary" href="/">Back to portfolio</a>
      </div>
    </main>
  </body>
</html>
